overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

# Vite+ reports its core package version for the Vite alias.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/build-output-utils@0.9.5"
  - "@cloudflare/config@0.28.1"
  - "@cloudflare/runtime-types@0.1.16"
  - "@cloudflare/runtime-types@0.1.17"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.6"
  - cf@1.0.0-beta.24
  - miniflare@5.20261023.1-beta
  - wrangler@4.154.0
